<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSubtitles Uploader</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="OpenSubtitles Uploader — drag & drop interface, automatic file pairing, language detection, and movie recognition." />
    <meta name="keywords" content="opensubtitles, subtitles, uploader, srt, vtt, movies, tv shows" />
    <meta name="author" content="OpenSubtitles" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OpenSubtitles Uploader" />
    <meta property="og:description" content="Subtitle uploader with drag & drop interface and intelligent file processing." />
    <meta property="og:url" content="https://www.opensubtitles.com" />
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  </head>
  <body>
    <div id="root"></div>
    <!-- Node-globals shim for WASM glue (guessit-js, etc.) that reads
         `process.env.*` / `global` at load time. Must run before module scripts. -->
    <script>
      window.process = window.process || { env: {}, version: '', platform: 'browser', browser: true, nextTick: (cb) => queueMicrotask(cb) };
      window.global = window.global || window;
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
